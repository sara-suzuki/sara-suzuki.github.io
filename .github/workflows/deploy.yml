name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install blog dependencies
        run: npm ci
        working-directory: blog

      - name: Build Astro blog
        run: npm run build
        working-directory: blog

      - name: Assemble site
        run: |
          mkdir -p _site/blog
          rsync -av \
            --exclude='blog/' \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='_site/' \
            --exclude='.DS_Store' \
            . _site/
          cp -r blog/dist/. _site/blog/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
